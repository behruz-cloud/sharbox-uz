<!doctype html>
<html lang="uz" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>sharbox.uz — Eksklyuziv Sovg'a Bokslari & Sharlar</title>
    <meta name="description" content="Qo'l mehnati bilan tayyorlangan eksklyuziv sovg'alar, romantik bokslar va geliy sharlari. Instagram va Telegram orqali qulay buyurtma bering!" />
    <meta property="og:title" content="sharbox.uz — Eksklyuziv Sovg'alar" />
    <meta property="og:description" content="Har bir qutida quvonch va mehr! Qo'l mehnati sovg'a bokslari." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#e11d48" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
    
    <!-- Prevent theme flash script -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('sharbox_theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 antialiased selection:bg-rose-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
